<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>职业性格探测 · 你适合什么工作</title>
  <style>
    /* 小清新色系：奶白 + 浅豆绿 + 雾霾蓝 + 藕粉 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans', sans-serif;
    }

    body {
      background: linear-gradient(160deg, #f4f9f4 0%, #f7f6f0 40%, #f0f4f8 100%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 16px 12px 40px;
    }

    .app {
      max-width: 500px;
      width: 100%;
      background: rgba(255, 255, 252, 0.86);
      backdrop-filter: blur(8px);
      border-radius: 36px;
      padding: 28px 22px 32px;
      box-shadow: 0 16px 40px rgba(160, 180, 170, 0.10), 0 4px 16px rgba(180, 200, 210, 0.08);
      border: 1px solid #e2ece4;
    }

    .main-title {
      font-size: 21px;
      font-weight: 500;
      letter-spacing: -0.3px;
      color: #5e7468;
      text-align: center;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .subhead {
      text-align: center;
      font-size: 14px;
      color: #a3b8ad;
      margin-bottom: 24px;
      font-weight: 380;
      border-bottom: 1px solid #e4ede6;
      padding-bottom: 16px;
    }

    .intro {
      background: #f2f8f3;
      padding: 18px 18px;
      border-radius: 24px;
      margin-bottom: 24px;
      font-size: 15px;
      line-height: 1.6;
      color: #6e8579;
      font-weight: 380;
      border: 1px solid #dcebe0;
    }

    .intro p {
      margin-bottom: 6px;
    }

    .question-card {
      transition: opacity 0.2s ease;
    }

    .progress {
      text-align: right;
      font-size: 13px;
      color: #b0c5b9;
      margin-bottom: 12px;
      letter-spacing: 0.3px;
    }

    .question-text {
      font-size: 18px;
      font-weight: 480;
      color: #4f665a;
      line-height: 1.5;
      margin-bottom: 22px;
      padding-right: 8px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: #f9fcf9;
      border: 1.5px solid #dcebe2;
      border-radius: 60px;
      padding: 16px 20px;
      font-size: 15.5px;
      font-weight: 400;
      color: #5e7468;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
      line-height: 1.4;
      box-shadow: 0 1px 3px rgba(160, 180, 170, 0.06);
      -webkit-tap-highlight-color: transparent;
    }

    .option-btn:active {
      background: #eaf4ed;
      border-color: #b8d3c4;
    }

    .option-btn.selected {
      background: #e3f2e8;
      border-color: #a7c7b6;
      color: #3f5a4c;
      font-weight: 450;
      box-shadow: 0 3px 10px rgba(150, 190, 170, 0.16);
    }

    .next-btn-container {
      margin-top: 32px;
      display: flex;
      justify-content: center;
    }

    .next-btn {
      background: #d8ebdf;
      border: none;
      border-radius: 60px;
      padding: 15px 48px;
      font-size: 17px;
      font-weight: 440;
      color: #4a6357;
      cursor: pointer;
      transition: all 0.15s;
      width: 100%;
      letter-spacing: 0.5px;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 6px 16px rgba(170, 205, 185, 0.22);
      border: 1px solid #cde3d6;
    }

    .next-btn:active {
      background: #c8e0d2;
      transform: scale(0.99);
    }

    .next-btn:disabled {
      opacity: 0.45;
      pointer-events: none;
      box-shadow: none;
    }

    .result-container {
      margin-top: 8px;
    }

    .type-card {
      background: #ffffff;
      border-radius: 32px;
      padding: 28px 22px 24px;
      border: 1px solid #e2ece6;
      box-shadow: 0 10px 28px rgba(160, 190, 175, 0.09);
    }

    .type-code {
      font-size: 26px;
      font-weight: 500;
      color: #4b6356;
      letter-spacing: 1px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .type-tag {
      font-size: 13px;
      background: #eaf4ee;
      color: #7a9b89;
      padding: 4px 12px;
      border-radius: 40px;
      font-weight: 380;
    }

    .type-name {
      font-size: 18px;
      font-weight: 450;
      color: #5e8471;
      margin-bottom: 6px;
    }

    .result-divider {
      height: 2px;
      background: linear-gradient(to right, #d5e8dd, transparent);
      margin: 16px 0 20px;
      width: 100%;
    }

    .result-text {
      font-size: 16px;
      line-height: 1.7;
      color: #647d70;
      font-weight: 380;
      margin-bottom: 20px;
    }

    .result-text p {
      margin-bottom: 14px;
    }

    /* 新增：详细解说区块 */
    .explain-section {
      background: #f7fbf8;
      border: 1px solid #ddeee4;
      border-radius: 24px;
      padding: 20px 18px;
      margin: 22px 0 18px;
    }

    .explain-title {
      font-size: 16px;
      font-weight: 500;
      color: #507766;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .explain-text {
      font-size: 15px;
      line-height: 1.75;
      color: #5f7d6d;
      font-weight: 380;
    }

    .explain-text p {
      margin-bottom: 12px;
    }

    .explain-text strong {
      color: #3f6652;
      font-weight: 480;
    }

    .dimension-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 16px 0 8px;
    }

    .dimension-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #6b8879;
    }

    .dimension-label {
      width: 32px;
      font-weight: 460;
      color: #507766;
    }

    .dimension-track {
      flex: 1;
      height: 8px;
      background: #e6f0ea;
      border-radius: 10px;
      overflow: hidden;
    }

    .dimension-fill {
      height: 100%;
      background: linear-gradient(90deg, #b8d9c6, #8fc2a8);
      border-radius: 10px;
    }

    .dimension-value {
      width: 24px;
      text-align: right;
      font-size: 13px;
      color: #7e9c8b;
    }

    /* 具体职业区块 */
    .career-section {
      margin: 22px 0 8px;
    }

    .career-title {
      font-size: 16px;
      font-weight: 500;
      color: #5a7b68;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .career-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .career-item {
      background: #f9fcf9;
      border: 1px solid #e0efe6;
      border-radius: 20px;
      padding: 14px 16px;
    }

    .career-item-title {
      font-weight: 460;
      color: #4f6b5c;
      font-size: 15.5px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .career-item-desc {
      font-size: 14px;
      line-height: 1.6;
      color: #7b9587;
      font-weight: 380;
    }

    .emotion-note {
      background: #f2f9f4;
      padding: 14px 16px;
      border-radius: 20px;
      font-size: 14.5px;
      color: #7b9787;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      border: 1px dashed #cfe6d8;
      line-height: 1.5;
    }

    .restart-btn {
      background: transparent;
      border: 1.5px solid #d5e8dd;
      border-radius: 60px;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 430;
      color: #6b8a78;
      width: 100%;
      margin-top: 26px;
      cursor: pointer;
      transition: 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .restart-btn:active {
      background: #eaf4ee;
      border-color: #b8d3c4;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 380px) {
      .app {
        padding: 20px 16px 28px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        padding: 14px 16px;
        font-size: 14.5px;
      }
      .type-code {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
<div class="app">
  <h1 class="main-title">职业性格探测</h1>
  <div class="subhead">你适合什么样的工作？</div>

  <div id="coverSection">
    <div class="intro">
      <p>🌱 15个关于你的日常选择，</p>
      <p>融合 MBTI 与霍兰德职业兴趣，</p>
      <p>帮你找到更对味的工作方向。</p>
      <p style="font-size:14px; color:#a3b8ad; margin-top:8px;">—— 不贴标签，只帮你看见自己 ——</p>
    </div>
    <div class="next-btn-container">
      <button class="next-btn" id="startBtn">开始测试</button>
    </div>
  </div>

  <div id="quizSection" class="hidden">
    <div class="question-card">
      <div class="progress" id="progressText">1 / 15</div>
      <div class="question-text" id="questionText">题目加载中...</div>
      <div class="options" id="optionsContainer"></div>
      <div class="next-btn-container">
        <button class="next-btn" id="nextBtn" disabled>下一题</button>
      </div>
    </div>
  </div>

  <div id="resultSection" class="hidden result-container"></div>
</div>

<script>
  (function() {
    // 题目保持不变
    const questions = [
      { q: '1. 面对一个新任务，你更习惯？', options: ['先规划步骤，按计划推进', '边做边想，在行动中调整', '先找人讨论，碰撞想法', '自己安静研究，独立完成'] },
      { q: '2. 你更喜欢和什么样的人共事？', options: ['务实高效，目标清晰', '有创意，脑洞大开', '温和友善，团队氛围好', '专业能力强，能带我成长'] },
      { q: '3. 工作里最让你有成就感的是？', options: ['解决了一个实际难题', '做出了一个漂亮的作品/方案', '帮助了同事或客户', '学到了新知识/新技能'] },
      { q: '4. 你更倾向哪种工作节奏？', options: ['快节奏，多任务并行', '稳定有序，按部就班', '自由弹性，自己安排', '项目制，有忙有闲'] },
      { q: '5. 以下哪种工作内容更吸引你？', options: ['数据分析、流程优化', '设计、写作、创意表达', '沟通协调、服务他人', '动手操作、技术实操'] },
      { q: '6. 做决定时你更依赖？', options: ['逻辑分析和客观事实', '直觉和整体感觉', '对他人的影响和感受', '过往经验和具体细节'] },
      { q: '7. 你理想的工作环境是？', options: ['安静独立，少被打扰', '开放热闹，随时交流', '整洁有序，规则清晰', '自由随性，有生活感'] },
      { q: '8. 你更愿意花时间在？', options: ['研究事物运作的原理', '构思新颖的点子', '维系和深化人际关系', '打磨具体的手艺/技能'] },
      { q: '9. 面对压力，你通常会？', options: ['拆解问题，逐个击破', '先放一放，换个角度想', '找朋友聊聊，寻求支持', '埋头做事，用行动化解'] },

      { q: '12. 你更擅长处理？', options: ['数据、图表、系统', '文字、图像、概念', '人、关系、情绪', '工具、设备、实物'] },
      { q: '13. 学习新东西时，你更喜欢？', options: ['看教材/文档，系统学', '直接上手试，边做边学', '和别人交流讨论', '观察模仿，慢慢琢磨'] },
      { q: '14. 你对“规则”的态度是？', options: ['规则是效率的保障', '规则可以灵活变通', '规则要照顾到每个人', '规则越少越自在'] },
      { q: '15. 你希望工作带给你什么？', options: ['专业上的精进', '创意上的满足', '人际上的连接', '生活上的安稳'] }
    ];

    // 选项对霍兰德六维的权重（R实用 I研究 A艺术 S社会 E企业 C常规）
    const optionEffects = [
      [{R:1,C:2,J:1}, {R:2,E:1,P:1}, {S:2,E:2,F:1}, {I:2,R:1,I_MBTI:1}],

        careers: [

          { title: '实验室技术员 / 科研助理', detail: '在规范流程中做实验、记录数据，严谨又有探索感。' },

      },
      'RS': {

        reason: '你的选择中频繁出现「务实高效」「帮助他人」「稳定有序」等倾向。面对任务你倾向于规划或独立完成，同时成就感常来自帮助同事或客户。霍兰德得分中 R（实用型）和 S（社会型）突出，说明你既愿意动手做事，也在意对他人的实际支持。',

      'RC': {

        reason: '你的选择偏向「按计划推进」「稳定有序」「整洁有序」等，说明你在工作中重视规则和准确性。霍兰德代码中 R（实用型）和 C（常规型）得分最高，代表你喜欢具体、可预期、有标准可循的工作内容，并且能耐心把细节做好。',

      selectedOptionIndex = userAnswers[index];

        const btn = document.createElement('button');
        btn.classList.add('option-btn');
        if (selectedOptionIndex === optIdx) btn.classList.add('selected');

          btn.classList.add('selected');
          selectedOptionIndex = optIdx;

        optionsContainer.appendChild(btn);
      });
      nextBtn.disabled = (selectedOptionIndex === null);

    function computeHolland(answers) {
      const scores = { R:0, I:0, A:0, S:0, E:0, C:0 };
      answers.forEach((ansIdx, qIndex) => {
        if (ansIdx === null) return;
        const effects = optionEffects[qIndex][ansIdx];
        if (!effects) return;
        for (let key in scores) {
          if (effects[key]) scores[key] += effects[key];
        }
      });
      return scores;
    }

    function getTopTwo(scores) {
      const arr = Object.entries(scores).map(([k, v]) => ({ k, v }));
      arr.sort((a, b) => b.v - a.v);
      return [arr[0].k, arr[1].k];
    }

      const key = topTwo[0] + topTwo[1];
      if (typeDescriptions[key]) return typeDescriptions[key];
      const key2 = topTwo[1] + topTwo[0];
      if (typeDescriptions[key2]) return typeDescriptions[key2];
      const fallbackKeys = Object.keys(typeDescriptions).filter(k => k[0] === topTwo[0]);
      if (fallbackKeys.length > 0) return typeDescriptions[fallbackKeys[0]];
      return defaultDesc;
    }

      if (currentQuestionIndex < questions.length - 1) {

                      <div class="dimension-fill" style="width:${(scores[d] / maxScore * 100)}%"></div>

                    <span class="dimension-value">${scores[d]}</span>
                  </div>
                `).join('')}

            </div>
          </div>

        resultSection.classList.add('hidden');
        userAnswers = new Array(15).fill(null);
